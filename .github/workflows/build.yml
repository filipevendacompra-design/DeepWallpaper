name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Cache do modelo de profundidade
        uses: actions/cache@v4
        with:
          path: model-cache
          key: depth-anything-v2-small-qaihub-v0.63.0
      - name: Modelo de profundidade (Depth Anything V2 Small, Qualcomm AI Hub, MIT)
        run: |
          mkdir -p model-cache app/src/main/assets
          if [ ! -f model-cache/depth.tflite ]; then
            curl -L --fail -o /tmp/m.zip https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/depth_anything_v2/releases/v0.63.0/depth_anything_v2-tflite-float.zip
            mkdir -p /tmp/m && unzip -o -q /tmp/m.zip -d /tmp/m
            f=$(find /tmp/m -name '*.tflite' | head -1)
            echo "Modelo: $f"; ls -la "$f"
            cp "$f" model-cache/depth.tflite
          fi
          cp model-cache/depth.tflite app/src/main/assets/depth.tflite
          ls -la app/src/main/assets
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: profundo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK na release "latest" (link fixo)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Profundo.apk
          git tag -f latest
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Profundo — último build" --notes "APK mais recente do ramo main."
          gh release upload latest Profundo.apk --clobber
